<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117" />
      <stop offset="50%" stop-color="#18141D" />
      <stop offset="100%" stop-color="#140D15" />
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#880E2B" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.0" />
      <stop offset="70%" stop-color="#E11D48" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="rubyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#E11D48" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0F1117" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="260" rx="16" fill="url(#bgGrad)" />

  <!-- Perspective Isometric Grid Floor -->
  <g opacity="0.6">
    <line x1="0" y1="210" x2="640" y2="210" stroke="url(#gridGrad)" stroke-width="1.2" />
    <line x1="0" y1="225" x2="640" y2="225" stroke="url(#gridGrad)" stroke-width="1.2" />
    <line x1="0" y1="242" x2="640" y2="242" stroke="url(#gridGrad)" stroke-width="1.5" />
    <!-- Diagonal grid perspective -->
    <line x1="120" y1="190" x2="40" y2="260" stroke="url(#gridGrad)" stroke-width="1" />
    <line x1="200" y1="190" x2="160" y2="260" stroke="url(#gridGrad)" stroke-width="1" />
    <line x1="280" y1="190" x2="280" y2="260" stroke="url(#gridGrad)" stroke-width="1" />
    <line x1="360" y1="190" x2="400" y2="260" stroke="url(#gridGrad)" stroke-width="1" />
    <line x1="440" y1="190" x2="520" y2="260" stroke="url(#gridGrad)" stroke-width="1" />
    <line x1="520" y1="190" x2="640" y2="250" stroke="url(#gridGrad)" stroke-width="1" />
  </g>

  <!-- Central Ruby Ambient Aura -->
  <circle cx="320" cy="120" r="130" fill="url(#rubyGlow)" />

  <!-- LEFT: 3D Wireframe Mesh (Sword / POD Model) -->
  <g transform="translate(60, 45)" stroke="#38BDF8" stroke-width="1.4" fill="none" opacity="0.85">
    <!-- 3D Sword blade wireframe -->
    <polygon points="40,20 60,70 50,150 40,170 30,150 20,70" stroke="#38BDF8" fill="#38BDF8" fill-opacity="0.08" />
    <line x1="40" y1="20" x2="40" y2="170" stroke="#7DD3FC" stroke-width="1.8" />
    <line x1="20" y1="70" x2="60" y2="70" stroke="#38BDF8" />
    <line x1="30" y1="150" x2="50" y2="150" stroke="#38BDF8" />
    <!-- Crossguard -->
    <polygon points="10,140 70,140 65,150 15,150" stroke="#60A5FA" fill="#60A5FA" fill-opacity="0.2" />
    <!-- Hilt & Pommel -->
    <line x1="40" y1="150" x2="40" y2="185" stroke="#93C5FD" stroke-width="2" />
    <circle cx="40" cy="190" r="5" stroke="#93C5FD" fill="#38BDF8" />

    <!-- Vertex Dots -->
    <circle cx="40" cy="20" r="3" fill="#BAE6FD" />
    <circle cx="20" cy="70" r="2.5" fill="#BAE6FD" />
    <circle cx="60" cy="70" r="2.5" fill="#BAE6FD" />
    <circle cx="30" cy="150" r="2.5" fill="#BAE6FD" />
    <circle cx="50" cy="150" r="2.5" fill="#BAE6FD" />
    <!-- Stream line into core -->
    <path d="M 65 100 Q 120 100 160 115" stroke="#38BDF8" stroke-dasharray="4,4" stroke-width="1.5" fill="none" />
  </g>

  <!-- CENTER: Ruby GG Core Matrix Gemstone -->
  <g transform="translate(260, 60)" filter="url(#glow)">
    <!-- Outer Gem facets -->
    <polygon points="60,10 100,35 100,85 60,110 20,85 20,35" fill="url(#rubyGrad)" stroke="#FDA4AF" stroke-width="1.8" />
    <!-- Facet reflections -->
    <polygon points="60,10 60,60 20,35" fill="#FFF1F2" fill-opacity="0.25" />
    <polygon points="60,10 100,35 60,60" fill="#FF4D6D" fill-opacity="0.4" />
    <polygon points="100,35 100,85 60,60" fill="#9F1239" fill-opacity="0.5" />
    <polygon points="100,85 60,110 60,60" fill="#880E2B" fill-opacity="0.7" />
    <polygon points="60,110 20,85 60,60" fill="#E11D48" fill-opacity="0.6" />
    <polygon points="20,85 20,35 60,60" fill="#FB7185" fill-opacity="0.3" />

    <!-- Core pulse node -->
    <circle cx="60" cy="60" r="8" fill="#FFF" opacity="0.9" />
  </g>

  <!-- RIGHT: 3D Viewport Scene / Camera Frustum -->
  <g transform="translate(430, 45)">
    <!-- Frustum Projection Pyramids -->
    <polygon points="30,70 120,25 145,115 55,160" fill="#E11D48" fill-opacity="0.08" stroke="#F43F5E" stroke-width="1.2" stroke-dasharray="3,3" />
    
    <!-- Platform Block (Swordigo terrain) -->
    <polygon points="70,120 130,95 155,105 95,130" fill="#334155" stroke="#64748B" stroke-width="1.5" />
    <polygon points="70,120 95,130 95,150 70,140" fill="#1E293B" stroke="#475569" stroke-width="1.2" />
    <polygon points="95,130 155,105 155,125 95,150" fill="#0F172A" stroke="#334155" stroke-width="1.2" />

    <!-- Camera Lens Icon / Node -->
    <circle cx="25" cy="70" r="9" fill="#1E293B" stroke="#F43F5E" stroke-width="2" />
    <circle cx="25" cy="70" r="4" fill="#FB7185" />
    <line x1="25" y1="70" x2="70" y2="120" stroke="#F43F5E" stroke-width="1.5" opacity="0.7" />
    <line x1="25" y1="70" x2="120" y2="25" stroke="#F43F5E" stroke-width="1.5" opacity="0.7" />

    <!-- Stream link from center to right -->
    <path d="M -50 75 Q 0 70 25 70" stroke="#FB7185" stroke-dasharray="4,4" stroke-width="1.5" fill="none" />
  </g>

  <!-- Digital Tech Accents & Floating Tags -->
  <g font-family="sans-serif" font-size="10" font-weight="bold" fill="#94A3B8" opacity="0.75">
    <text x="75" y="32" fill="#38BDF8">POD MESH</text>
    <text x="290" y="32" fill="#FB7185">RUBY GG CORE</text>
    <text x="490" y="32" fill="#34D399">3D SCENE FRUSTUM</text>
  </g>
</svg>
