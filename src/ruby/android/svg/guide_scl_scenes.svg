<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="sclBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061E14" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="treeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <radialGradient id="sclGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#061E14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="400" height="220" rx="14" fill="url(#sclBg)" />
  <circle cx="200" cy="110" r="100" fill="url(#sclGlow)" />

  <!-- Left: Scene Tree Hierarchy -->
  <g transform="translate(30, 40)">
    <!-- Root Node -->
    <rect x="0" y="0" width="90" height="24" rx="5" fill="#064E3B" stroke="#10B981" stroke-width="1.2" />
    <text x="12" y="16" fill="#6EE7B7" font-family="monospace" font-size="10" font-weight="bold">SceneRoot</text>

    <!-- Branch Lines -->
    <path d="M 45 24 L 45 55 L 75 55" stroke="url(#treeLine)" stroke-width="1.5" fill="none" />
    <path d="M 45 55 L 45 105 L 75 105" stroke="url(#treeLine)" stroke-width="1.5" fill="none" />

    <!-- Child Node 1: Hero -->
    <rect x="75" y="43" width="95" height="24" rx="5" fill="#134E4A" stroke="#2DD4BF" stroke-width="1.2" />
    <text x="85" y="59" fill="#99F6E4" font-family="monospace" font-size="10">hero (Actor)</text>

    <!-- Child Node 2: Props -->
    <rect x="75" y="93" width="95" height="24" rx="5" fill="#1E293B" stroke="#64748B" stroke-width="1.2" />
    <text x="85" y="109" fill="#CBD5E1" font-family="monospace" font-size="10">platform_01</text>
  </g>

  <!-- Right: 3D Spatial Bounding Box & Coordinates -->
  <g transform="translate(225, 45)">
    <!-- Bounding Box Wireframe (LocalAabb) -->
    <rect x="15" y="15" width="110" height="85" rx="4" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,4" />
    
    <!-- Coordinate Pivot Axes -->
    <line x1="70" y1="58" x2="115" y2="58" stroke="#EF4444" stroke-width="2" />
    <polygon points="115,55 122,58 115,61" fill="#EF4444" />
    <text x="125" y="62" fill="#EF4444" font-family="monospace" font-size="10" font-weight="bold">X</text>

    <line x1="70" y1="58" x2="70" y2="20" stroke="#10B981" stroke-width="2" />
    <polygon points="67,20 70,13 73,20" fill="#10B981" />
    <text x="66" y="10" fill="#10B981" font-family="monospace" font-size="10" font-weight="bold">Y</text>

    <circle cx="70" cy="58" r="4" fill="#FFF" stroke="#3B82F6" stroke-width="2" />

    <!-- AABB Bounds Label -->
    <text x="25" y="120" fill="#34D399" font-family="monospace" font-size="10">LocalAabb [80x60]</text>
  </g>

  <!-- Bottom Badges -->
  <g font-family="monospace" font-size="10" fill="#94A3B8">
    <rect x="25" y="175" width="130" height="24" rx="6" fill="#022C22" stroke="#059669" stroke-width="1" />
    <text x="35" y="191" fill="#34D399" font-weight="bold">PROTOBUF COMPILED</text>

    <rect x="250" y="175" width="125" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="260" y="191" fill="#38BDF8">DEPTH: [-5.0..5.0]</text>
  </g>
</svg>
